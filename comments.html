<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>評語查詢 - 阿能資科</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="./js/config.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
        }
    </style>
</head>

<body class="bg-gray-100 min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [searchName, setSearchName] = React.useState('');
            const [results, setResults] = React.useState(null);
            const [loading, setLoading] = React.useState(false);

            const handleSearch = async (e) => {
                e.preventDefault();
                if (!searchName.trim()) return;

                setLoading(true);
                try {
                    const response = await fetch(`${CONFIG.GAS_API_URL}?name=${encodeURIComponent(searchName)}`);
                    const data = await response.json();

                    if (data.status === 'success') {
                        setResults(data.data);
                    } else {
                        setResults([]);
                        alert('查詢失敗：' + data.message);
                    }
                } catch (error) {
                    console.error(error);
                    alert('連線錯誤，請確認網路或 API 網址。');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="max-w-4xl mx-auto p-6">
                    <header className="mb-8 flex justify-between items-center">
                        <h1 className="text-3xl font-bold text-gray-800">📋 作業評語查詢</h1>
                        <a href="index.html" className="text-purple-600 hover:bg-purple-50 px-4 py-2 rounded-lg transition">回首頁</a>
                    </header>

                    <div className="bg-white rounded-xl shadow-lg p-6 mb-8">
                        <form onSubmit={handleSearch} className="flex gap-4">
                            <input
                                type="text"
                                value={searchName}
                                onChange={e => setSearchName(e.target.value)}
                                placeholder="輸入姓名查詢..."
                                className="flex-1 px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-purple-500 outline-none text-lg"
                            />
                            <button
                                type="submit"
                                disabled={loading}
                                className="bg-purple-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-purple-700 transition disabled:bg-gray-400"
                            >
                                {loading ? '查詢中...' : '查詢'}
                            </button>
                        </form>
                    </div>

                    <div className="grid gap-6 md:grid-cols-2">
                        {results && results.length === 0 && (
                            <div className="col-span-2 text-center text-gray-500 py-10">
                                找不到「{searchName}」的作業紀錄。
                            </div>
                        )}

                        {results && results.map((item, index) => (
                            <div key={index} className="bg-white rounded-2xl shadow-xl overflow-hidden hover:shadow-2xl transition duration-300 transform hover:-translate-y-1">
                                {/* Header with 4-char comment */}
                                <div className="bg-gradient-to-r from-purple-600 to-indigo-600 p-6 text-center text-white relative overflow-hidden">
                                    <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]"></div>
                                    <div className="text-sm opacity-80 mb-1">{new Date(item.time).toLocaleString()}</div>
                                    <h2 className="text-3xl font-bold tracking-widest my-2 drop-shadow-md">{item.comment}</h2>
                                </div>

                                <div className="p-6">
                                    <div className="mb-4">
                                        <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1">作品摘要</h3>
                                        <p className="text-gray-600 text-sm line-clamp-3 italic bg-gray-50 p-3 rounded-lg border border-gray-100">
                                            "{item.content.substring(0, 100)}{item.content.length > 100 ? '...' : ''}"
                                        </p>
                                    </div>

                                    <div>
                                        <h3 className="text-xs font-bold text-gray-400 uppercase tracking-wide mb-1">老師回饋</h3>
                                        <p className="text-gray-800 leading-relaxed">
                                            {item.feedback}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
